<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 { color: #2d3748; }
    p  { color: #718096; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.4rem;
      background: #4299e1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #3182ce; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from GitHub Pages 👋</h1>
    <p>This is a self-contained HTML file served via GitHub Pages.</p>
    <button onclick="document.querySelector('p').textContent = 'It works!'">Click me</button>
  </div>
</body>
</html>
